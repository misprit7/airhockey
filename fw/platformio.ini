[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli

; Geometry and cable kinematics are shared with sw/ — see shared/cdpr_geometry.h
build_flags = -I../shared

; Explicit expanded-region characterization image; normal policy build stays
; on the previously tested workspace. No motor activation on boot.
[env:teensy41_probe]
extends = env:teensy41
build_flags = -I../shared -DAIRHOCKEY_PROBE_WORKSPACE
